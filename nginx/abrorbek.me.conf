# /etc/nginx/sites-available/abrorbek.me
#
# O'rnatish:
#   sudo cp nginx/abrorbek.me.conf /etc/nginx/sites-available/abrorbek.me
#   sudo ln -sf /etc/nginx/sites-available/abrorbek.me /etc/nginx/sites-enabled/abrorbek.me
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Keyin SSL (certbot 443 blokini o'zi qo'shadi):
#   sudo certbot --nginx -d abrorbek.me -d www.abrorbek.me

server {
    listen 80;
    listen [::]:80;
    server_name abrorbek.me www.abrorbek.me;

    # Fayl yuklash uchun (rasm/hujjat)
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
