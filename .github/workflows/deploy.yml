name: Deploy crm-lms-backend
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy over SSH and run Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # MUHIM: default 10m yetmaydi - docker build undan uzoq davom etadi
          command_timeout: 40m
          script: |
            set -e

            PROJECT_DIR="/root/crm-lms-backend"

            # 1. Papka mavjudligini tekshirish
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Project directory not found. Cloning..."
              git clone https://github.com/soatmurotov1/crm-lms-backend.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"

            # 2. Konfliktlarni oldini olish uchun "Hard Reset"
            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # 3. .env majburiy - bo'sh fayl bilan ilova ishga tushmaydi
            if [ ! -f .env ]; then
              echo "ERROR: .env fayli topilmadi!"
              echo "Serverda '$PROJECT_DIR/.env' faylini qo'lda yarating (nano .env)."
              exit 1
            fi

            # 4. Image'ni oldin quramiz (eski konteynerlar ishlab turgan holda)
            echo "==> Building new image..."
            docker compose build

            # 5. MIGRATSIYA - app ishga tushishidan OLDIN.
            #
            # Ilgari bu qadam `docker compose exec -T app` bilan, ya'ni app
            # ko'tarilgandan KEYIN bajarilardi. Bu tovuq-tuxum muammosini
            # yaratardi: yangi kod yangi schema'ni kutadi, topmay yiqiladi,
            # `restart: unless-stopped` uni qayta ko'taradi va shu payt
            # `exec` "No such exec instance" xatosi bilan tugaydi.
            #
            # `run --rm` bir martalik konteyner ochadi: u app'ning ishlab
            # turishiga bog'liq emas va migratsiya har doim o'tadi.
            # `depends_on` sharti tufayli avval baza sog'lom bo'lishi kutiladi.
            echo "==> Applying database migrations..."
            docker compose run --rm app npx prisma migrate deploy

            # 6. Endi app'ni yangi (to'g'ri) schema bilan ko'taramiz
            echo "==> Restarting containers..."
            docker compose up -d --remove-orphans

            # 7. App haqiqatan ko'tarilganini tekshiramiz.
            # Ilgari bu tsikl natijani tekshirmasdan tugardi - konteyner
            # yiqilgan bo'lsa ham deploy "muvaffaqiyatli" deb yakunlanardi.
            echo "==> Waiting for app container..."
            APP_UP=0
            for i in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Running}}' crm-lms-backend-app 2>/dev/null)" = "true" ]; then
                # Bir necha soniya kutamiz: crash-loop'dagi konteyner ham
                # qisqa vaqtga "Running" bo'lib turadi.
                sleep 5
                if [ "$(docker inspect -f '{{.State.Running}}' crm-lms-backend-app 2>/dev/null)" = "true" ]; then
                  APP_UP=1
                  break
                fi
              fi
              sleep 2
            done

            if [ "$APP_UP" != "1" ]; then
              echo "ERROR: app konteyneri ko'tarilmadi. Oxirgi loglar:"
              docker compose logs --tail=80 app
              exit 1
            fi

            # 8. Kunlik zaxira cron'ini o'rnatish.
            #
            # Skript idempotent: o'z yozuvini almashtiradi, boshqa cron
            # yozuvlariga tegmaydi. Shu sababli har deploy'da bemalol
            # chaqirilaveradi va "yozilgan, lekin serverga o'rnatilmagan"
            # holati qaytalanmaydi.
            #
            # Bu qadam deploy'ni YIQITMASLIGI kerak: zaxira sozlanmagani
            # yomon, lekin ilovani yangilamay qoldirish undan ham yomon.
            echo "==> Installing backup cron..."
            chmod +x scripts/*.sh || true
            ./scripts/install-backup-cron.sh || echo "WARNING: zaxira cron'ini o'rnatib bo'lmadi"

            # 9. Eski image qatlamlarini tozalash (build'dan KEYIN)
            echo "==> Cleaning up old docker images..."
            docker image prune -f

            # 10. Natijani ko'rsatish
            docker compose ps
            docker compose logs --tail=40 app

            echo "Deployment finished successfully!"
