name: Deploy crm-lms-backend
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy over SSH and run Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # MUHIM: default 10m yetmaydi - docker build undan uzoq davom etadi
          command_timeout: 40m
          script: |
            set -e

            PROJECT_DIR="/root/crm-lms-backend"

            # 1. Papka mavjudligini tekshirish
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Project directory not found. Cloning..."
              git clone https://github.com/soatmurotov1/crm-lms-backend.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"

            # 2. Konfliktlarni oldini olish uchun "Hard Reset"
            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # 3. .env majburiy - bo'sh fayl bilan ilova ishga tushmaydi
            if [ ! -f .env ]; then
              echo "ERROR: .env fayli topilmadi!"
              echo "Serverda '$PROJECT_DIR/.env' faylini qo'lda yarating (nano .env)."
              exit 1
            fi

            # 4. Image'ni oldin quramiz (eski konteynerlar ishlab turgan holda)
            echo "==> Building new image..."
            docker compose build

            # 5. Konteynerlarni almashtirish
            echo "==> Restarting containers..."
            docker compose up -d --remove-orphans

            # 6. App konteyneri ko'tarilishini kutish
            echo "==> Waiting for app container..."
            for i in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Running}}' crm-lms-backend-app 2>/dev/null)" = "true" ]; then
                break
              fi
              sleep 2
            done

            # 7. DB migratsiyalarini qo'llash
            echo "==> Applying database migrations..."
            docker compose exec -T app npx prisma migrate deploy

            # 8. Migratsiyadan keyin app'ni qayta ishga tushirish
            # (birinchi deployda superadmin seed jadvallar yaratilgunicha ishlamaydi)
            echo "==> Restarting app after migrations..."
            docker compose restart app

            # 9. Eski image qatlamlarini tozalash (build'dan KEYIN)
            echo "==> Cleaning up old docker images..."
            docker image prune -f

            # 10. Natijani ko'rsatish
            docker compose ps
            docker compose logs --tail=40 app

            echo "Deployment finished successfully!"
